apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-worker-config
  namespace: iot-pipeline
data:
  # This file intentionally holds placeholder values, not your real account ID —
  # keep the real ones in your local, gitignored .env and regenerate this
  # object directly from it instead of hand-editing this file:
  #   kubectl create configmap iot-worker-config -n iot-pipeline \
  #     --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
  AWS_REGION: "eu-west-1"
  QUEUE_URL: "https://sqs.eu-west-1.amazonaws.com/123456789012/iot-telemetry-worker-queue-dev"
  TABLE_NAME: "IotTelemetryData-dev"
  PORT: "3000"
  VISIBILITY_TIMEOUT_SECONDS: "60"
  MAX_MESSAGES: "10"

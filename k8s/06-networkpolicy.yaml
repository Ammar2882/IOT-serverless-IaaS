apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iot-worker-egress
  namespace: iot-pipeline
spec:
  podSelector:
    matchLabels:
      app: iot-worker
  policyTypes:
    - Egress
  egress:
    # DNS resolution (CoreDNS lives in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS to AWS APIs (SQS, DynamoDB) — external, so no pod/namespace selector applies
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

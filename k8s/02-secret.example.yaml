# EXAMPLE ONLY — do not fill this in and commit it.
#
# This shows the shape of the Secret the Deployment expects, for reference.
# Create the real one imperatively instead, so credentials never touch the repo:
#
#   kubectl create secret generic iot-worker-aws-credentials \
#     --namespace iot-pipeline \
#     --from-literal=AWS_ACCESS_KEY_ID=<your-access-key-id> \
#     --from-literal=AWS_SECRET_ACCESS_KEY=<your-secret-access-key>
#
# On real EKS you wouldn't do even this much — you'd use IRSA (IAM Roles for
# Service Accounts) so pods assume an IAM role via a projected token and no
# long-lived AWS keys exist anywhere. We'll cover that when it's relevant;
# this Secret-based approach is the local-cluster equivalent for learning.
apiVersion: v1
kind: Secret
metadata:
  name: iot-worker-aws-credentials
  namespace: iot-pipeline
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
